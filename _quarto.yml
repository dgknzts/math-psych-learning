project:
  type: website
  output-dir: docs
  render:
    - "*.qmd"
    - "!MEMORY.md"

website:
  title: "Mathematical Psychology Learning Hub"
  navbar:
    left:
      - text: "Home"
        href: index.qmd
      - text: "Lectures"
        href: lectures/index.qmd
      - text: "Demos"
        href: demos/index.qmd
      - text: "Exercises"
        href: exercises/index.qmd
  page-footer:
    center: "Built with Quarto"

format:
  html:
    theme: cosmo
    toc: true
    code-fold: true
    code-tools: true

execute:
  freeze: auto
